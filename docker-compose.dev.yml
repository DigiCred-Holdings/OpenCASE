# Development overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# OpenCASE uses Dockerfile.dev with source baked into the image (no bind mounts
# required) — suitable for Railway and other hosts that cannot mount repo paths.
#
# Optional local hot-reload: uncomment the src/tsconfig volume lines below so
# host edits reach ts-node-dev without rebuilding. Leave them commented for
# deploy environments.
#
# Networking (HTTP/HTTPS, ports) is controlled by .env — not this file.

services:
  opencase:
    # Use dev Dockerfile instead of production build
    build:
      context: ./apps/opencase
      dockerfile: Dockerfile.dev
    volumes:
      # Runtime data only — source/tsconfig are copied in Dockerfile.dev
      - ./apps/opencase/data:/app/data
      # Optional local hot-reload (do not enable on Railway):
      # - ./apps/opencase/src:/app/src:ro
      # - ./apps/opencase/tsconfig.json:/app/tsconfig.json:ro
    # Remove restart policy for dev (fail fast, see errors)
    restart: "no"
